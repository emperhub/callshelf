name: Update contributor image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test contributor image generator
        run: node --test tests/update-contributors.test.mjs

      - name: Generate contributor image
        run: node scripts/update-contributors.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed image
        run: |
          if git diff --quiet -- docs/contributors.svg; then
            echo "Contributor image is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contributors.svg
          git commit -m "chore: update contributor image"
          git push
